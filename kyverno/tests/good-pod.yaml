apiVersion: v1
kind: Pod
metadata:
  name: good-pod
spec:
  containers:
    - name: eks-monitor
      image: ghcr.io/mayanksekhar/golang-eks-monitor-app@sha256:253fc58c4d705199de41bda2624321e7fa2744c2
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      resources:
        limits:
          cpu: "500m"
          memory: "256Mi"
        requests:
          cpu: "100m"
          memory: "128Mi"
