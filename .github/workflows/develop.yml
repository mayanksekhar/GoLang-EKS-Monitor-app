name: Develop — Build + Push to GHCR

on:
  push:
    branches:
      - develop
  pull_request:
    branches:
      - main

jobs:
  sast:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config=auto --json --output=semgrep-results.json . || true
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-results-develop
          path: semgrep-results.json

  sca:
    name: SCA — Trivy + Nancy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - run: go mod tidy
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 0
      - name: Install Nancy
        run: go install github.com/sonatype-nexus-community/nancy@latest
      - name: Nancy scan
        run: go list -json -deps ./... | nancy sleuth || true

  build-push:
    name: Build + Push to GHCR
    runs-on: ubuntu-latest
    needs: [sast, sca]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/golang-eks-monitor-app:develop
            ghcr.io/${{ github.repository_owner }}/golang-eks-monitor-app:dev-${{ github.sha }}
