name: Main — Full DevSecOps Pipeline

on:
  push:
    branches:
      - main

jobs:
  sast:
    name: SAST — Semgrep
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Run Semgrep
        run: |
          pip install semgrep
          semgrep scan --config=auto --json --output=semgrep-results.json . || true
      - uses: actions/upload-artifact@v4
        with:
          name: semgrep-results-main
          path: semgrep-results.json

  sca:
    name: SCA — Trivy + Nancy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
      - run: go mod tidy
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: fs
          scan-ref: .
          format: json
          output: trivy-fs-results.json
          exit-code: 0
      - name: Install Nancy
        run: go install github.com/sonatype-nexus-community/nancy@latest
      - name: Nancy scan
        run: go list -json -deps ./... | nancy sleuth || true
      - uses: actions/upload-artifact@v4
        with:
          name: sca-results
          path: trivy-fs-results.json

  kyverno-policy:
    name: Kyverno Policy Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install Kyverno CLI
        run: |
          curl -sL https://github.com/kyverno/kyverno/releases/download/v1.12.0/kyverno-cli_v1.12.0_linux_x86_64.tar.gz \
            | tar xz -C /tmp
          sudo install /tmp/kyverno /usr/local/bin/kyverno
          kyverno version
      - name: Validate good pod passes all policies
        run: |
          kyverno apply kyverno/policies/ \
            --resource kyverno/tests/good-pod.yaml \
            --detailed-results
      - name: Validate floating tag is rejected
        run: |
          result=$(kyverno apply kyverno/policies/require-image-digest.yaml \
            --resource kyverno/tests/bad-pod-floating-tag.yaml \
            --detailed-results 2>&1) || true
          echo "$result"
          if echo "$result" | grep -q "pass: 0"; then
            echo "PASS — floating tag correctly rejected"
          else
            echo "FAIL — floating tag should have been rejected"
            exit 1
          fi
      - name: Validate wrong registry is rejected
        run: |
          result=$(kyverno apply kyverno/policies/require-ghcr-registry.yaml \
            --resource kyverno/tests/bad-pod-wrong-registry.yaml \
            --detailed-results 2>&1) || true
          echo "$result"
          if echo "$result" | grep -q "pass: 0"; then
            echo "PASS — wrong registry correctly rejected"
          else
            echo "FAIL — wrong registry should have been rejected"
            exit 1
          fi

  build-sign-push:
    name: Build + Sign + Push to GHCR
    runs-on: ubuntu-latest
    needs: [sast, sca, kyverno-policy]
    permissions:
      contents: read
      packages: write
      id-token: write
    outputs:
      image-digest: ${{ steps.build.outputs.digest }}
      image-ref: ${{ steps.image-ref.outputs.ref }}
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/golang-eks-monitor-app:main
            ghcr.io/${{ github.repository_owner }}/golang-eks-monitor-app:${{ github.sha }}

      - name: Set image ref with digest
        id: image-ref
        run: |
          echo "ref=ghcr.io/${{ github.repository_owner }}/golang-eks-monitor-app@${{ steps.build.outputs.digest }}" >> $GITHUB_OUTPUT
          echo "Image digest: ${{ steps.build.outputs.digest }}"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image with Cosign keyless
        run: |
          cosign sign --yes \
            ghcr.io/${{ github.repository_owner }}/golang-eks-monitor-app@${{ steps.build.outputs.digest }}
          echo "Image signed: ghcr.io/${{ github.repository_owner }}/golang-eks-monitor-app@${{ steps.build.outputs.digest }}"

      - name: Verify Cosign signature
        run: |
          cosign verify \
            ghcr.io/${{ github.repository_owner }}/golang-eks-monitor-app@${{ steps.build.outputs.digest }} \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/main.yml" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
          echo "Signature verified successfully"

      - name: Generate image SBOM
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: image
          image-ref: ghcr.io/${{ github.repository_owner }}/golang-eks-monitor-app@${{ steps.build.outputs.digest }}
          format: cyclonedx
          output: image-sbom.cdx.json

      - uses: actions/upload-artifact@v4
        with:
          name: image-sbom
          path: image-sbom.cdx.json

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: build-sign-push
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Setup Helm
        uses: azure/setup-helm@v3

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name eks-monitor-demo \
            --region ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Verify Cosign signature before deploy
        run: |
          curl -sL https://github.com/sigstore/cosign/releases/latest/download/cosign-linux-amd64 \
            -o /usr/local/bin/cosign && chmod +x /usr/local/bin/cosign
          cosign verify \
            ghcr.io/${{ github.repository_owner }}/golang-eks-monitor-app@${{ needs.build-sign-push.outputs.image-digest }} \
            --certificate-identity-regexp="https://github.com/${{ github.repository }}/.github/workflows/main.yml" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com"
          echo "Pre-deploy signature verification passed"

      - name: Deploy via Helm with digest
        run: |
          DIGEST=${{ needs.build-sign-push.outputs.image-digest }}
          echo "Deploying image with digest: $DIGEST"
          helm upgrade --install eks-monitor ./helm/eks-monitor \
            --namespace eks-monitor \
            --create-namespace \
            --set image.repository=ghcr.io/${{ github.repository_owner }}/golang-eks-monitor-app \
            --set image.digest=${DIGEST} \
            --set env.CLUSTER_NAME=eks-monitor-demo \
            --wait --timeout 5m

      - name: Verify deployment
        run: |
          kubectl get pods -n eks-monitor
          kubectl get svc -n eks-monitor

  kbom:
    name: KBOM Scan
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name eks-monitor-demo \
            --region ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Install Trivy
        run: |
          curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

      - name: Run KBOM scan
        run: |
          trivy k8s \
            --report all \
            --format cyclonedx \
            --scanners vuln \
            --output kbom.cdx.json
          echo "KBOM components found:"
          cat kbom.cdx.json | jq '.components | length'

      - name: Vulnerability scan on KBOM
        run: |
          trivy sbom \
            --scanners vuln \
            --format table \
            kbom.cdx.json || true

      - uses: actions/upload-artifact@v4
        with:
          name: kbom-report
          path: kbom.cdx.json

  falco-verify:
    name: Falco Runtime Verification
    runs-on: ubuntu-latest
    needs: deploy
    permissions:
      contents: read
    steps:
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Setup kubectl
        uses: azure/setup-kubectl@v3

      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --name eks-monitor-demo \
            --region ${{ secrets.AWS_DEFAULT_REGION }}

      - name: Verify Falco is running
        run: |
          kubectl get pods -n falco
          FALCO_POD=$(kubectl get pod -n falco -l app.kubernetes.io/name=falco -o jsonpath='{.items[0].metadata.name}')
          echo "Falco pod: $FALCO_POD"
          kubectl logs $FALCO_POD -n falco -c falco --tail=20
          kubectl logs $FALCO_POD -n falco -c falco | grep -c "Loading rules" && \
            echo "Falco rules loaded successfully" || \
            echo "Warning: Could not confirm rule loading"

  report:
    name: Pipeline Report
    runs-on: ubuntu-latest
    needs: [kbom, falco-verify]
    if: always()
    steps:
      - name: Summary
        run: |
          echo "========================================"
          echo "  GoLang EKS Monitor — Pipeline Report"
          echo "========================================"
          echo " SAST          — Semgrep"
          echo " SCA           — Trivy + Nancy"
          echo " Policy Gate   — Kyverno (4 policies)"
          echo " Build         — Docker multi-stage"
          echo " Sign          — Cosign keyless OIDC"
          echo " Verify        — Cosign pre-deploy check"
          echo " Deploy        — Helm with SHA digest"
          echo " KBOM          — Trivy CycloneDX"
          echo " Runtime       — Falco eBPF"
          echo "========================================"
          echo " Thinkwerke DevSecOps Portfolio"
          echo "========================================"
