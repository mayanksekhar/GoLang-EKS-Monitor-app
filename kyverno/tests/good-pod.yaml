apiVersion: v1
kind: Pod
metadata:
  name: good-pod
spec:
  containers:
    - name: eks-monitor
      image: ghcr.io/mayanksekhar/golang-eks-monitor-app@sha256:abc11cec7bcc5945a1b1a4e0be9d3b6bfc963cb816893dcd1c603455e4094aa7
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
      resources:
        limits:
          cpu: "500m"
          memory: "256Mi"
        requests:
          cpu: "100m"
          memory: "128Mi"
